                                - it-product-benefit
                                - life-insurance-benefit
                                - meal-benefit
                                - nursery-benefit
                                - pension-plan-benefit
                                - renting-benefit
                                - retirement-insurance-benefit
                                - transport-benefit
                                - unknown
                                - wellness-benefit
                                example: meal-benefit
                              sumType:
                                type: string
                                description: The sum type of the consumption
                                enum:
