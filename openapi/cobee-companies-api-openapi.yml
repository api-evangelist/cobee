                        legalId:
                          type: string
                          description: The employee's legal id
                          example: 129387655X
                        consumptions:
                          type: array
                          description: List of employee consumptions
                          items:
                            type: object
                            required:
                            - behaviour
                            - category
                            - sumType
                            - amountInCents
                            properties:
                              behaviour:
                                type: string
                                description: The behaviour type of the consumption
                                enum:
                                - allowance
                                - allowance-not-exempt
                                - flex
                                - flex-not-exempt
                                example: allowance
                              category:
                                type: string
                                description: The category of the consumption
                                enum:
                                - any
