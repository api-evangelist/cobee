        in: query
        required: false
        description: The unique identifier of the payroll cycle. If not provided, the open payroll cycle will be used.
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        description: "The format of the resulting consumptions.\n - `lines`: as many lines as grouping benefits for each employee\n - `columns`: one line for each employee and as many columns as grouping benefits"
        schema:
          type: string
          enum:
          - lines
          - columns
      - name: categories
        in: query
        required: false
        description: List of benefit categories to include in the response, which will return them in the same order as requested.
        schema:
          type: string
      - name: groupBy
        in: query
        required: false
        description: "Consumptions can be grouped to return data that is more similar to how your system works. The consumptions can be grouped by:\n - `category`: it will calculate the sum of expenses minus withdrawals for all the consumptions in a category,\n - `category,behaviour`: sum of all expenses minus withdrawals for all the consumptions in category and behaviour."
        schema:
          type: string
          enum:
          - category
          - category,behaviour
      responses:
