                  legalId: B12345678
                  currency: EUR
                payrollCycle:
                  id: 7f4c9ba8-9c2d-4b82-8b8c-e5f8f8f8f8f8
                  start: 1672531200
                  end: 1675123200
                  fiscalYear: '2023'
                  payrollMonth: '03'
                employees:
                - employeeId: 7f4c9ba8-9c2d-4b82-8b8c-e5f8f8f8f8f8
                  internalId: '12345'
                  legalId: 129387655X
                  consumptions:
                  - behaviour: allowance
                    category: meal-benefit
                    sumType: expenses
                    amountInCents: 4500000
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found - The employee, company, or payroll cycle was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Resource not found
        '500':
          description: Internal Server Error - Something went wrong on our end
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
