components:
  schemas:
    MonetaryAmount:
      type: object
      required:
      - amountInCents
      - currency
      properties:
        amountInCents:
          type: integer
          description: The monetary amount in cents (e.g., 4500000 for 45,000)
          minimum: 0
        currency:
          type: string
          description: The currency code (e.g., EUR)
          example: EUR
      example:
        amountInCents: 4500000
        currency: EUR
    CreateConsumptionRequest:
      type: object
      required:
      - concept
      - category
      - behaviour
      - amount
      properties:
        concept:
          type: string
          description: The concept of the consumption
          example: meal
        category:
          type: string
          description: The category of the consumption
          enum:
          - any
          - capitalization-benefit
          - claps-benefit
          - custom-benefit
          - education-benefit
          - gym-benefit
          - health-insurance-benefit
          - home-office-benefit
          - individual-capitalization-benefit
          - it-product-benefit
          - life-insurance-benefit
          - meal-benefit
          - nursery-benefit
          - pension-plan-benefit
          - renting-benefit
          - retirement-insurance-benefit
          - transport-benefit
          - unknown
          - wellness-benefit
          example: meal-benefit
        behaviour:
          enum:
          - allowance
          - allowance-not-exempt
          - flex
          - flex-not-exempt
          description: The behaviour of the consumption
        amount:
          type: number
          description: The amount of the consumption
    MigrateEmployeeRequest:
      type: object
      required:
      - newCompanyId
      - email
      - legalId
      - name
      - surname
      - birthDate
      - grossSalary
      - hiringDate
      - taxRegime
      properties:
        newCompanyId:
          type: string
          format: uuid
          description: The id of the destination company
        email:
          type: string
          format: email
          description: The employee's email address
        legalId:
          type: string
          description: The employee's legal identifier
        name:
          type: string
          description: The employee's first name
        surname:
          type: string
          description: The employee's surname
        birthDate:
          type: string
          format: date
          description: The employee's date of birth in ISO 8601 format (YYYY-MM-DD)
        grossSalary:
          $ref: '#/components/schemas/MonetaryAmount'
          description: The employee's gross salary details
        hiringDate:
          type: string
          format: date
          description: The date when the employee was hired in ISO 8601 format (YYYY-MM-DD)
        taxRegime:
          type: string
          enum:
          - general
          - basque
          - navarrese
          - biscayan
          description: The employee's tax regime
        internalId:
          type: string
          description: Your internal identifier for the employee
        costCenter:
          type: string
          description: The cost centre associated with this employee
        payrollCompany:
          type: string
          description: The company handling the employee's payroll, if different from the main company
        metadata:
          type: object
          description: Additional metadata for the employee (key-value pairs)
          additionalProperties: true
          example:
            department: Finance
            manager: Jane Doe
            office: Madrid
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the company
        name:
          type: string
          description: The name of the company
        legalId:
          type: string
          description: The legal identification number of the company
        legalName:
          type: string
          description: The legal name of the company
        state:
          type: string
          enum:
          - active
          description: The state of the company
        contactEmail:
          type: string
          format: email
          description: The contact email of the company
        corporationId:
          type: string
          nullable: true
          description: The corporation ID if applicable, otherwise null
        countryISO2Code:
          type: string
          description: The two-letter ISO code of the company's country
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        legalAddress:
          $ref: '#/components/schemas/Address'
      required:
      - id
      - name
      - legalId
      - legalName
      - state
      - contactEmail
      - countryISO2Code
      - deliveryAddress
      - legalAddress
    Employee:
      type: object
      required:
      - id
      - email
      - legalId
      - name
      - surname
      - birthDate
      - grossSalary
      - hiringDate
      - taxRegime
      - workdayConfiguration
      - internalId
      - modelId
      - state
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the employee
        email:
          type: string
          format: email
          description: The employee's email address
        legalId:
          type: string
          description: The employee's legal identifier
        name:
          type: string
          description: The employee's first name
        surname:
          type: string
          description: The employee's surname
        birthDate:
          type: string
          format: date
          description: The employee's date of birth in ISO 8601 format (YYYY-MM-DD)
        grossSalary:
          $ref: '#/components/schemas/MonetaryAmount'
          description: The employee's gross salary details
        hiringDate:
          type: string
          format: date
          description: The date when the employee was hired in ISO 8601 format (YYYY-MM-DD)
        taxRegime:
          type: string
          enum:
          - general
          - basque
          - navarrese
          - biscayan
          description: The employee's tax regime
        workdayConfiguration:
          $ref: '#/components/schemas/WorkdayConfiguration'
          description: Configuration of the employee's workday
        internalId:
          type: string
          description: Your internal identifier for the employee
        costCenter:
          type: string
          description: The cost centre associated with this employee
        payrollCompany:
          type: string
          description: The company handling the employee's payroll, if different from the main company
        modelId:
          type: string
          format: uuid
          description: The ID of the benefit model assigned to this employee
        metadata:
          type: object
          description: Additional metadata for the employee (key-value pairs)
          additionalProperties: true
        state:
          type: string
          enum:
          - not-active
          - active
          - removed
          - blocked
          description: The current state of the employee
    Address:
      type: object
      properties:
        streetName:
          type: string
          description: The name of the street
        streetNumber:
          type: string
          description: The number of the building
        details:
          type: string
