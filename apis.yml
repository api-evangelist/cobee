name: Cobee by Pluxee
description: >-
  Cobee is a Madrid-based flexible employee benefits and compensation platform,
  acquired by Pluxee (Sodexo group) in 2024. It lets companies manage a modular
  multi-benefit program (meal, transport, training, health and life insurance,
  wellbeing and employee discounts) from a single dashboard, delivered to
  employees through a Cobee VISA card and mobile app. Cobee exposes a REST
  Public API (v3, OpenAPI 3.0.1) for HR and payroll integrations, covering
  companies, employees, benefit models, payroll cycles, and benefit
  consumptions, with OAuth 2.0 client-credentials (Auth0-issued JWT) auth and a
  separate staging sandbox. The Public API is currently available to Spanish
  customers, with credentials issued by the customer's Customer Success Manager.
